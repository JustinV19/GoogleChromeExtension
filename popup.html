<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Rechnung</title>
    <link rel="stylesheet" href="popup.css">

</head>

<body>
    <div>
        <h1>Settings</h1>
    </div>
    </br>
    <div style="text-align: left;">
        <label>
            Name <br>
            <textarea name="gewerbeName" id="gewerbeName" rows="1" cols="25"></textarea>
        </label>
        <label>
            Straße <br>
            <textarea name="strasse" id="strasse" rows="1" cols="25"></textarea>
        </label>
        <label>
            Haus-Nr <br>
            <textarea name="hausNr" id="hausNr" rows="1" cols="25"></textarea>
        </label>
        <label>
            Postleizahl <br>
            <textarea name="postleiZahl" id="postleiZahl" rows="1" cols="25" style="resize: none;"></textarea>
        </label>
        <label>
            Stadt <br>
            <textarea name="stadt" id="stadt" rows="1" cols="25" style="resize: none;"></textarea>
        </label>
        <label>
            Land <br>
            <textarea name="land" id="land" rows="1" cols="25" style="resize: none;"></textarea>
        </label>
        <label>
            Umsatzsteuer-Nr <br>
            <textarea name="umsatzsteuerNr" id="umsatzsteuerNr" rows="1" cols="25" style="resize: none;"></textarea>
        </label>
        <label>
            Extra <br>
            <textarea name="extra" id="extra" rows="4" cols="25" maxlength="200"
                placeholder="Schreibe hier extra Informationen rein.... " style="resize: none;"></textarea>
        </label>
        <label>
            Logo(Pfad eingeben) <br>
            <textarea name="logo" id="logo" rows="1" cols="25" placeholder="Optional" style="resize: none;"></textarea>
        </label>

    </div>
    </br>
    <div>
        <label>
            <input type="radio" name="ausgabe" value="JSON">
            JSON
        </label>
        <label>
            <input type="radio" name="ausgabe" value="PDF">
            PDF
        </label>
    </div>
    </br>
    <div>
        <button id="save">Save</button>
    </div>


    <script src="popup.js"></script>
</body>

</html>
