<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Rechnung</title>
    <link rel="stylesheet" href="popup.css">

</head>

<body>
    <div>
        <h1>Settings</h1>
    </div>
    </br>
    <div style="text-align: left;">
        <label>
            Name
            <input type="textarea" name="gewerbeName"> 
        </label>
        <label>
            Straße
            <input type="textarea" name="strasse"> 
        </label>
        <label>
            Haus-Nr
            <input type="textarea" name="hausNr"> 
        </label>
        <label>
            Postleizahl
            <input type="textarea" name="postleiZahl"> 
        </label>
        <label>
            Stadt
            <input type="textarea" name="stadt"> 
        </label>
        <label>
            Land
            <input type="textarea" name="land"> 
        </label>
        <label>
            Umsatzsteuer-Nr
            <input type="textarea" name="umsatzsteuerNr"> 
        </label>
        <label>
            Extra
            <input type="textarea" name="extra" placeholder="Optional">
        </label>
        <label>
            Logo(Pfad eingeben)
            <input type="textarea" name="logo" placeholder="Optional"> 
        </label>
        
    </div>
    </br>
    <div>
        <label>
            <input type="radio" name="ausgabe" value="JSON">
            JSON
        </label>
        <label>
            <input type="radio" name="ausgabe" value="PDF">
            PDF
        </label>
    </div>
    </br>
    <div>
        <button id="save">Save</button>
    </div>


<script src="popup.js"></script>
</body>

</html>
